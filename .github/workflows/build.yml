name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pypdf reportlab openpyxl
      - name: Build
        run: pyinstaller formfillbatch.spec
      - name: Package
        run: Compress-Archive -Path dist/FormFillBatch -DestinationPath FormFillBatch-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FormFillBatch-Windows
          path: FormFillBatch-Windows.zip
